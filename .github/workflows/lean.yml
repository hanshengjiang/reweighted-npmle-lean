name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          build: 'true'
          use-mathlib-cache: 'true'
      - name: Check axiom allowlist and bundled data
        run: python3 scripts/verify.py --skip-build
      - name: Test verification and clean export tooling
        run: python3 -m unittest discover -s tests -v
      - name: Check frozen release sources, manuscript hashes, and audit links
        run: python3 scripts/check_release.py
      - name: Validate preserved Comparator evidence against current source hashes
        run: python3 scripts/check_comparator_record.py
      - name: Recheck main theorem type and semantic audit examples
        run: |
          lake env lean audit/main-result-2026-09-29/StatementAudit.lean
          lake env lean audit/main-result-2026-09-29/SemanticChecks.lean
          lake env lean audit/release-checks/StatementCoverageChecks.lean
      - name: Compile separate Comparator interfaces (no external checker rerun)
        run: lake build ComparatorChallenge ComparatorSolution
