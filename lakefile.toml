name = "reweighted_npmle"
version = "0.1.0"
defaultTargets = ["ReweightedNPMLE", "Verification"]

[[lean_lib]]
name = "ReweightedNPMLE"

[[lean_lib]]
name = "Verification"

[[lean_lib]]
name = "ComparatorChallenge"
roots = ["audit.comparator.Challenge"]

[[lean_lib]]
name = "ComparatorSolution"
roots = ["audit.comparator.Solution"]

[[lean_lib]]
name = "ComparatorControls"
roots = ["audit.comparator.controls.ChangedDefinition", "audit.comparator.controls.UnprovedSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"
